name: MAGE temporal phase history test
on:
  push:
    branches: [main]
    paths:
      - "experiments/mage_temporal_phase_history/**"
      - ".github/workflows/mage-temporal-phase-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jbackk-lang/MAGE-IN-IMAGE-DECODER
          path: mage-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - name: Analyze real committed image sequence
        run: python experiments/mage_temporal_phase_history/test_phase_history.py --mage-root mage-data --clip Test001 --out results/mage_phase_history_Test001.json
      - uses: actions/upload-artifact@v4
        with:
          name: mage-temporal-phase-history-Test001
          path: results/mage_phase_history_Test001.json
          if-no-files-found: error
          retention-days: 90
