name: Repository regression checks

on:
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - "core/**"
      - "filters/**"
      - "TIMDR-Math-Formalism/**"
      - "TIMDR-Geometry-Formalism/**"
      - "TIMDR-Modal-Formalism/**"
      - "TIMDR-Time-Formalism/**"
      - "tests/**"
      - ".github/workflows/experiment-relocation-checks.yml"
  pull_request:
    paths:
      - "experiments/**"
      - "core/**"
      - "filters/**"
      - "TIMDR-Math-Formalism/**"
      - "TIMDR-Geometry-Formalism/**"
      - "TIMDR-Modal-Formalism/**"
      - "TIMDR-Time-Formalism/**"
      - "tests/test_chronoprocess_*.py"
      - "tests/test_phase_recovery_probe.py"
      - "tests/test_triple_loop_*.py"
      - "tests/test_experiment_compatibility_entries.py"
      - "tests/test_analytic_tube.py"
      - "tests/test_bent_tube.py"
      - "tests/test_chrono_cone_bridge.py"
      - "tests/test_chrono_cone_bridge_v2.py"
      - "tests/test_chrono_cone_bridge_v3.py"
      - "tests/test_chrono_membrane_bridge.py"
      - "tests/test_chrono_trumpet_spectrum.py"
      - "tests/test_geometric_resonance_operator.py"
      - "tests/test_mobius_kg_bridge.py"
      - "tests/test_modal_speed_tracking.py"
      - "tests/test_real_chrono_membrane_bridge_independent.py"
      - "tests/test_real_chrono_membrane_bridge_v0_2.py"
      - "tests/test_reflection_transition.py"
      - "tests/test_signal_geometry_lift.py"
      - "tests/test_sg_background.py"
      - "tests/test_sg_perturbations.py"
      - "tests/test_sg_shooting.py"
      - "tests/test_signal_character.py"
      - "tests/test_transition_params.py"
      - "tests/test_trefoil_frenet_torsion.py"
      - "tests/test_trefoil_missing_coordinate_solver.py"
      - "tests/test_trefoil_resonance_model.py"
      - "tests/test_trefoil_weather_embedding_validation.py"
      - "tests/test_vendor_senscore_gia_filter.py"
      - "tests/test_zero_mode_topology_bridge.py"
      - ".github/workflows/experiment-relocation-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Compile relocated experiments and compatibility entry points
        run: python -m compileall -q experiments/*.py experiments/chronoprocess experiments/rhombic_prism experiments/reflections
      - name: Validate every legacy compatibility entry point
        run: python -m pytest -q tests/test_experiment_compatibility_entries.py
      - name: Run tests that import legacy experiment paths
        run: |
          python -m pytest -q \
            tests/test_chronoprocess_coupled_phase_recovery.py \
            tests/test_chronoprocess_triple_loop_duration_sweep.py \
            tests/test_chronoprocess_triple_loop_time_history.py \
            tests/test_phase_recovery_probe.py \
            tests/test_triple_loop_coupled_perturbation.py \
            tests/test_triple_loop_transition_probe.py


  formalism-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install formalism test dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib pytest
      - name: Test Math formalism
        run: python -m pytest -q TIMDR-Math-Formalism/tests
      - name: Test Geometry formalism
        run: python -m pytest -q TIMDR-Geometry-Formalism/tests
      - name: Test Modal formalism
        run: python -m pytest -q TIMDR-Modal-Formalism/tests
      - name: Test Time formalism and Fourier bridge
        run: python -m pytest -q TIMDR-Time-Formalism/tests

  uncovered-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Run uncovered synthetic and unit regression tests
        run: |
          python -m pytest -q \
            tests/test_analytic_tube.py \
            tests/test_bent_tube.py \
            tests/test_chrono_cone_bridge.py \
            tests/test_chrono_cone_bridge_v2.py \
            tests/test_chrono_cone_bridge_v3.py \
            tests/test_chrono_membrane_bridge.py \
            tests/test_chrono_trumpet_spectrum.py \
            tests/test_geometric_resonance_operator.py \
            tests/test_mobius_kg_bridge.py \
            tests/test_modal_speed_tracking.py \
            tests/test_real_chrono_membrane_bridge_independent.py \
            tests/test_real_chrono_membrane_bridge_v0_2.py \
            tests/test_reflection_transition.py \
            tests/test_signal_geometry_lift.py \
            tests/test_sg_background.py \
            tests/test_sg_perturbations.py \
            tests/test_sg_shooting.py \
            tests/test_signal_character.py \
            tests/test_transition_params.py \
            tests/test_trefoil_frenet_torsion.py \
            tests/test_trefoil_missing_coordinate_solver.py \
            tests/test_trefoil_resonance_model.py \
            tests/test_trefoil_weather_embedding_validation.py \
            tests/test_vendor_senscore_gia_filter.py \
            tests/test_zero_mode_topology_bridge.py
