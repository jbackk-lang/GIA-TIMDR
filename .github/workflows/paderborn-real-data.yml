name: Paderborn real data - one click

on:
  workflow_dispatch:
    inputs:
      bearing:
        description: "Official Paderborn bearing archive to check"
        type: choice
        required: true
        default: K002
        options:
          - K002
          - K003
          - K004
          - K005
          - K006
          - KA04
          - KA15
          - KA16
          - KA22
          - KA30
          - KI04
          - KI14
          - KI16
          - KI18
          - KI21

permissions:
  contents: read

jobs:
  download-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download selected official archive
        env:
          BEARING: ${{ inputs.bearing || 'K002' }}
        run: |
          set -euo pipefail
          mkdir -p raw
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            "https://groups.uni-paderborn.de/kat/BearingDataCenter/${BEARING}.rar" \
            --output "raw/${BEARING}.rar"
          test "$(stat -c%s "raw/${BEARING}.rar")" -gt 1000000
          python - <<'PY'
          import os
          from pathlib import Path
          name = os.environ["BEARING"]
          p = Path("raw") / (name + ".rar")
          with p.open("rb") as f:
              sig = f.read(8)
          assert sig.startswith(b"Rar!\x1a\x07"), "File is not a RAR archive"
          print("Official RAR archive signature verified:", name)
          PY
      - name: Inspect real measurement files inside archive
        env:
          BEARING: ${{ inputs.bearing || 'K002' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          7z l "raw/${BEARING}.rar" > archive-listing.txt
          python - <<'PY'
          import os, re
          from pathlib import Path
          bearing = os.environ["BEARING"]
          listing = Path("archive-listing.txt").read_text(errors="replace")
          conditions = ("N15_M07_F10", "N09_M07_F10", "N15_M01_F10", "N15_M07_F04")
          missing = [f"{cd}_{bearing}_{n}.mat" for cd in conditions for n in range(1, 21)
                     if not re.search(r"(?<![\\w])" + re.escape(f"{cd}_{bearing}_{n}.mat") + r"(?![\\w])", listing)]
          print("Expected measurements:", 80)
          print("Missing measurements:", len(missing))
          if missing:
              print("First missing entries:", missing[:10])
              raise SystemExit(1)
          print("All 80 measurement names present in official archive")
          PY
      - name: Read one real vibration signal
        env:
          BEARING: ${{ inputs.bearing || 'K002' }}
        run: |
          python -m pip install --quiet "numpy>=1.24,<3" "scipy>=1.11,<2"
          python - <<'PY'
          import os, subprocess
          from io import BytesIO
          import numpy as np
          from scipy.io import loadmat
          bearing = os.environ["BEARING"]
          member = f"{bearing}/N15_M07_F10_{bearing}_1.mat"
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              subprocess.run(
                  ["7z", "x", "-y", f"raw/{bearing}.rar", f"-o{tmp}", member],
                  check=True, stdout=subprocess.DEVNULL)
              matches = list(Path(tmp).rglob(f"N15_M07_F10_{bearing}_1.mat"))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one MATLAB measurement, found {len(matches)}")
              data = loadmat(matches[0], squeeze_me=True, struct_as_record=False)
          s = data[next(k for k in data if not k.startswith("__"))]
          channels = {entry.Name: entry.Data for entry in s.Y}
          vibration = np.asarray(channels["vibration_1"], dtype=np.float64)
          assert vibration.size > 64000
          assert np.isfinite(vibration).all()
          print("Real vibration samples:", vibration.size)
          print("Mean:", float(vibration.mean()))
          print("RMS:", float(np.sqrt(np.mean(vibration**2))))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"\\n### Real vibration readout\\n- Measurement: \\x60{member}\\x60\\n"
                      f"- Samples: **{vibration.size:,}**\\n"
                      f"- RMS: **{np.sqrt(np.mean(vibration**2)):.6g}**\\n")
          PY
      - name: Hash source file and publish manifest
        env:
          BEARING: ${{ inputs.bearing || 'K002' }}
        run: |
          python scripts/hash_paderborn_archives.py raw > paderborn-source-manifest.json
          python - <<'PY'
          import json, os
          with open("paderborn-source-manifest.json") as f:
              data = json.load(f)
          target = os.environ["BEARING"] + ".rar"
          assert any(x["name"] == target for x in data["files"])
          print("Downloaded:", target)
          print("SHA256:", next(x["sha256"] for x in data["files"] if x["name"] == target))
          PY
      - name: Show one-page result in GitHub Actions
        env:
          BEARING: ${{ inputs.bearing || 'K002' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open("paderborn-source-manifest.json") as f:
              manifest = json.load(f)
          name = os.environ["BEARING"] + ".rar"
          item = next(x for x in manifest["files"] if x["name"] == name)
          summary = (
              "## Real Paderborn archive verified\\n\\n"
              f"- Bearing: **{os.environ['BEARING']}**\\n"
              "- Source: Paderborn University Bearing Data Center\\n"
              "- Measurement names found: **80 / 80**\\n"
              f"- Archive size: **{item['size_bytes']:,} bytes**\\n"
              f"- SHA-256: \\x60{item['sha256']}\\x60\\n"
              "- Scope: data provenance only, **not a TIMDR benchmark**\\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          PY
      - name: Publish small provenance report only
        uses: actions/upload-artifact@v4
        with:
          name: paderborn-source-manifest-${{ inputs.bearing || 'K002' }}
          path: paderborn-source-manifest.json
          retention-days: 14
