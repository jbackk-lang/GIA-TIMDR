name: Helix characterization HC-01
on:
  push:
    branches: [main]
    paths:
      - "experiments/helix_characterization/**"
      - ".github/workflows/helix-characterization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hc01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install numpy
      - name: HC-01 unit tests
        run: python -m unittest discover -s experiments/helix_characterization/tests -v
      - name: Run parameter sweep
        run: python experiments/helix_characterization/hc01_circular_helix.py --out-dir artifacts/hc01
      - name: Upload HC-01 results
        uses: actions/upload-artifact@v4
        with:
          name: hc01-circular-helix-characterization
          path: artifacts/hc01/
          if-no-files-found: error
          retention-days: 90
