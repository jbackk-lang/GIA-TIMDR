name: Phase-to-field preservation test
on:
  push:
    branches: [main]
    paths:
      - "experiments/phase_field_preservation/**"
      - ".github/workflows/phase-field-preservation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s experiments/phase_field_preservation -p "test_*.py" -v
      - run: python experiments/phase_field_preservation/phase_field_preservation.py
