name: CHF RTE real electrical signal ingestion

on:
  workflow_dispatch:
    inputs:
      max_pairs:
        description: 'Number of voltage/current pairs to extract (1-100)'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  rte-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy scikit-learn
      - name: Download, SHA256-verify, extract CHF features
        env:
          MAX_PAIRS: ${{ inputs.max_pairs }}
        run: |
          python research/chrono_helix_fusion/rte_fetch_eval.py --out rte_pilot --max-pairs "$MAX_PAIRS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chf-rte-electrical-pilot
          path: rte_pilot/report.json
          if-no-files-found: warn
          retention-days: 14
