name: Helix four-to-three surface reduction
on:
  push:
    branches: [main]
    paths:
      - "experiments/helix_reduction/**"
      - "docs/geometry/FOUR_TO_THREE_HELIX_REDUCTION_ON_SPHERE_OR_EGG_v0.1.md"
      - ".github/workflows/helix-reduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Unit tests
        run: python -m unittest discover -s experiments/helix_reduction/tests -v
      - name: Run sphere model
        run: |
          mkdir -p artifacts
          python experiments/helix_reduction/four_to_three_surface_reduction.py --shape sphere --out artifacts/sphere_reduction.json
      - name: Run egg model
        run: |
          python experiments/helix_reduction/four_to_three_surface_reduction.py --shape egg --out artifacts/egg_reduction.json
      - name: Upload comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helix-four-to-three-sphere-egg
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
