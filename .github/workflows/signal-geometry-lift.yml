name: Signal geometry 2D-to-3D lift
on:
  push:
    branches: [main]
    paths:
      - "core/signal_geometry_lift.py"
      - "tests/test_signal_geometry_lift.py"
      - ".github/workflows/signal-geometry-lift.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Unit tests
        run: python -m unittest tests.test_signal_geometry_lift -v
