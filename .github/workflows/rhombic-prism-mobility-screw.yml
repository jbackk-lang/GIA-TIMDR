name: Rhombic prism mobility and screw coupling
on:
  push:
    branches: [main]
    paths:
      - "experiments/rhombic_prism_mobility_screw_coupling.py"
      - "experiments/rhombic_prism_ellipse_braid_relation.py"
      - "experiments/rhombic_prism_exceptional_affine_relations.py"
      - "experiments/rhombic_prism_locus_intersections.py"
      - "experiments/rhombic_prism_central_screw_unfolding.py"
      - "experiments/rhombic_prism_screw_unfolding_multidegree.py"
      - "experiments/rhombic_prism_screw_axis_spatial_organization.py"
      - "experiments/rhombic_prism_axis_limit_study.py"
      - "experiments/rhombic_prism_axis_conditioning_sensitivity.py"
      - "experiments/rhombic_prism_angle_spectrum_parameter_sweep.py"
      - "experiments/rhombic_prism_angle_spectrum_grid.py"
      - "experiments/rhombic_prism_angular_spectrum_symmetry_check.py"
      - "experiments/rhombic_prism_angular_spectrum_depth_convergence.py"
      - ".github/workflows/rhombic-prism-mobility-screw.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobility-screw-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy sympy
      - name: Scan mobility family and length-four screw spectra
        run: python experiments/rhombic_prism_mobility_screw_coupling.py
      - name: Prove exact braid relations on candidate ellipse
        run: python experiments/rhombic_prism_ellipse_braid_relation.py
      - name: Verify exceptional affine relations and glide conjugacy
        run: python experiments/rhombic_prism_exceptional_affine_relations.py
      - name: Classify intersections of the 12 Coxeter loci
        run: python experiments/rhombic_prism_locus_intersections.py
      - name: Probe screw-spectrum unfolding near the central configuration
        run: python experiments/rhombic_prism_central_screw_unfolding.py
      - name: Test screw unfolding at word lengths 2, 4 and 6
        run: python experiments/rhombic_prism_screw_unfolding_multidegree.py
      - name: Analyze spatial organization of screw axes
        run: python experiments/rhombic_prism_screw_axis_spatial_organization.py
      - name: Study rotation and screw axis limit through word length 8
        run: python experiments/rhombic_prism_axis_limit_study.py
      - name: Test axis cloud sensitivity to rotation cutoff
        run: python experiments/rhombic_prism_axis_conditioning_sensitivity.py
      - name: Test angular spectrum under larger deformations
        run: python experiments/rhombic_prism_angle_spectrum_parameter_sweep.py
      - name: Map angular spectrum across mobility parameter disk
        run: python experiments/rhombic_prism_angle_spectrum_grid.py
      - name: Verify D3 symmetry of complete angular spectra
        run: python experiments/rhombic_prism_angular_spectrum_symmetry_check.py
      - name: Compare angular spectra across word depths
        run: python experiments/rhombic_prism_angular_spectrum_depth_convergence.py
