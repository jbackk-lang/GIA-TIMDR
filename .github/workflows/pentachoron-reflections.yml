name: Pentachoron facet reflections
on:
  push:
    branches: [main]
    paths:
      - "experiments/pentachoron_facet_reflections.py"
      - ".github/workflows/pentachoron-reflections.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-4d-simplex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact pentachoron facet-reflection experiment
        run: python experiments/pentachoron_facet_reflections.py
