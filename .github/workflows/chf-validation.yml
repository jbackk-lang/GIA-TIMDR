name: CHF bridge validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/chrono_helix_fusion/**'
      - '.github/workflows/chf-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Compile check
        run: python -m compileall -q research/chrono_helix_fusion
      - name: Native 12 kHz smoke tests
        run: python -m unittest discover -s research/chrono_helix_fusion -p 'test_*.py' -v
      - name: Run synthetic repeated grouped validation
        run: python research/chrono_helix_fusion/validate_bridges.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chf-bridge-validation
          path: research/chrono_helix_fusion/validation_bridges.json
          if-no-files-found: warn
