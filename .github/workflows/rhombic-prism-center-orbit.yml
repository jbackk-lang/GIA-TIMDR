name: Rhombic prism central orbit geometry

on:
  push:
    paths:
      - 'experiments/rhombic_prism_center_orbit_geometry.py'
      - 'experiments/rhombic_prism_helix_commutator_audit.py'
      - 'experiments/rhombic_prism_center_commutator.py'
      - 'experiments/rhombic_prism_triangle_order_anomaly.py'
      - 'experiments/rhombic_prism_triangle_polynomial_system.py'
      - 'experiments/rhombic_prism_triangle_reduced_equations.py'
      - 'experiments/rhombic_prism_triangle_groebner_roots.py'
      - 'experiments/rhombic_prism_triangle_reflection_symmetry.py'
      - 'experiments/rhombic_prism_triangle_exact_symmetry.py'
      - 'experiments/rhombic_prism_triangle_d3_equivariance.py'
      - 'experiments/rhombic_prism_triangle_six_orders.py'
      - 'experiments/rhombic_prism_triangle_nine_shapes.py'
      - 'experiments/rhombic_prism_axis_limit_study.py'
      - 'experiments/rhombic_prism_mobility_screw_coupling.py'
      - '.github/workflows/rhombic-prism-center-orbit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  center-orbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scipy sympy
      - name: Check center orbit and screw identity
        run: python experiments/rhombic_prism_center_orbit_geometry.py
      - name: Check circular orbits and noncommutativity
        run: python experiments/rhombic_prism_helix_commutator_audit.py
      - name: Check centroid return under affine commutators
        run: python experiments/rhombic_prism_center_commutator.py
      - name: Check three-rotation order asymmetry and return candidates
        run: python experiments/rhombic_prism_triangle_order_anomaly.py
      - name: Check exact polynomial formulation
        run: python experiments/rhombic_prism_triangle_polynomial_system.py
      - name: Check elimination of height variable
        run: python experiments/rhombic_prism_triangle_reduced_equations.py
      - name: Verify Groebner eliminant and real roots
        run: python experiments/rhombic_prism_triangle_groebner_roots.py
      - name: Verify mirror symmetry of centroid-return roots
        run: python experiments/rhombic_prism_triangle_reflection_symmetry.py
      - name: Prove mirror symmetry and test 120-degree rotation exactly
        run: python experiments/rhombic_prism_triangle_exact_symmetry.py
      - name: Check D3 cyclic generator equivariance
        run: python experiments/rhombic_prism_triangle_d3_equivariance.py
      - name: Verify all six ordering identities
        run: python experiments/rhombic_prism_triangle_six_orders.py
      - name: Check nine-shape separation and D3 orbit sizes
        run: python experiments/rhombic_prism_triangle_nine_shapes.py
