<svg width="100%" viewBox="0 0 1000 1110" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">TIMDR — aktualna mapa pokrycia operatorów i wyników, 2026-09-22</title>
<desc id="desc">Siatka czterech gałęzi M/S, G, K i META-DYNAMICS oraz czterech rodzin pytań Λ, τ, ρ, J. Turkusowe kafle oznaczają operatory dodane 10 września; zielone własne kanały META; niebieskie wcześniejsze, pokrewne, ale odrębne znaczenia; szare brak osobnego operatora. Osobne karty pod siatką pokazują aktualne wyniki empiryczne i ograniczenia.</desc>
