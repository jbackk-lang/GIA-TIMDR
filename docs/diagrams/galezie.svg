<svg width="680" height="100" viewBox="0 0 680 100" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cztery gałęzie TIMDR</title>
<desc>Cztery niezależne konstrukcje matematyczne: M/S (sygnał), G (geometria), K (modalny), meta-dynamika (Λ-τ-ρ-J).</desc>
<g>
<rect x="40" y="20" width="135" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="107.5" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#0C447C">M/S — sygnał</text>
<text x="107.5" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Anomalia, skręt</text>
</g>
<g>
<rect x="190" y="20" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="257.5" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#085041">G — geometria</text>
<text x="257.5" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Skręt, krzywizna</text>
</g>
<g>
<rect x="340" y="20" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="407.5" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#3C3489">K — modalny</text>
<text x="407.5" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Rezonans fazowy</text>
</g>
<g>
<rect x="490" y="20" width="135" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="557.5" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#712B13">Meta-dynamika</text>
<text x="557.5" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">4 miary, 6 domen</text>
</g>
</svg>
